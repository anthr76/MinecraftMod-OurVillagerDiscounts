name: build
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "adopt"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Execute Gradle build
        id: build
        run: chmod +x ./gradlew && ./gradlew build
      - name: Print build outputs
        run: |
          echo "Minecraft version: ${{ steps.build.outputs.minecraftVersion }}"
          echo "Mod version: ${{ steps.build.outputs.version }}"
